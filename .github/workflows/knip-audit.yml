name: Knip audit

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  knip:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Knip
        run: npx --yes knip
