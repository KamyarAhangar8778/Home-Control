name: Sync Home-Control modules

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-modules.yml"
      - "Hardware/**"
      - "Database/**"
      - "Dashboard/**"
  workflow_dispatch:
  schedule:
    # Backup: reconcile child-only commits even if a child PAT secret is not configured.
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: home-control-module-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start from the latest parent main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

      - name: Reconcile child histories into their parent folders
        env:
          CHILD_REPOS_TOKEN: ${{ secrets.CHILD_REPOS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CHILD_REPOS_TOKEN:-}" ]]; then
            echo "::error::Create the repository secret CHILD_REPOS_TOKEN with Contents read/write access to all three child repositories."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the parent repository credential for the eventual push to origin.
          parent_auth_header="$(git config --local --get http.https://github.com/.extraheader || true)"

          # Remove the parent-only credential while reading child repositories, so
          # the child PAT is the credential Git sends to the child repositories.
          git config --local --unset-all http.https://github.com/.extraheader || true
          child_auth_header="$(printf '%s:%s' "$GITHUB_ACTOR" "$CHILD_REPOS_TOKEN" | base64 -w 0)"

          imported=false
          reconciled=false

          import_subtree() {
            local prefix="$1"
            local repository="$2"

            if ! git cat-file -e "HEAD:${prefix}" 2>/dev/null; then
              echo "Importing ${repository} into ${prefix}/ with its history"
              git -c "http.extraheader=AUTHORIZATION: basic ${child_auth_header}" \
                subtree add --prefix="${prefix}" "https://github.com/${repository}.git" main
              imported=true
            fi
          }

          reconcile_subtree() {
            local prefix="$1"
            local repository="$2"
            local before
            local after

            before="$(git rev-parse HEAD)"
            echo "Reconciling commits from ${repository}:main into ${prefix}/"

            git -c "http.extraheader=AUTHORIZATION: basic ${child_auth_header}" \
              subtree pull --prefix="${prefix}" "https://github.com/${repository}.git" main \
              -m "chore: reconcile ${prefix} with ${repository}"

            after="$(git rev-parse HEAD)"
            if [[ "$after" != "$before" ]]; then
              reconciled=true
            fi
          }

          import_subtree "Hardware" "KamyarAhangar8778/Home-Control-Hardwar-Codes"
          import_subtree "Database" "KamyarAhangar8778/Home-Control-DB"
          import_subtree "Dashboard" "KamyarAhangar8778/Home-Control-Dashboard"

          # Merge any commits made directly in child repositories into the matching
          # parent folder before splitting/pushing. No force push is used. If Git
          # detects conflicting edits to the same file, this step stops safely.
          reconcile_subtree "Hardware" "KamyarAhangar8778/Home-Control-Hardwar-Codes"
          reconcile_subtree "Database" "KamyarAhangar8778/Home-Control-DB"
          reconcile_subtree "Dashboard" "KamyarAhangar8778/Home-Control-Dashboard"

          # Restore the checkout credential so pushes back to the parent work.
          if [[ -n "$parent_auth_header" ]]; then
            git config --local http.https://github.com/.extraheader "$parent_auth_header"
          fi

          if [[ "$imported" == "true" || "$reconciled" == "true" ]]; then
            git push origin HEAD:main
          else
            echo "Child histories already match the parent subtrees; no parent merge commit needed."
          fi

      - name: Push Hardware subtree to its repository
        env:
          CHILD_REPOS_TOKEN: ${{ secrets.CHILD_REPOS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || true
          auth_header="$(printf '%s:%s' "$GITHUB_ACTOR" "$CHILD_REPOS_TOKEN" | base64 -w 0)"
          git subtree split --prefix=Hardware -b sync-hardware
          git -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" push \
            "https://github.com/KamyarAhangar8778/Home-Control-Hardwar-Codes.git" sync-hardware:main

      - name: Push Database subtree to its repository
        env:
          CHILD_REPOS_TOKEN: ${{ secrets.CHILD_REPOS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || true
          auth_header="$(printf '%s:%s' "$GITHUB_ACTOR" "$CHILD_REPOS_TOKEN" | base64 -w 0)"
          git subtree split --prefix=Database -b sync-database
          git -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" push \
            "https://github.com/KamyarAhangar8778/Home-Control-DB.git" sync-database:main

      - name: Push Dashboard subtree to its repository
        env:
          CHILD_REPOS_TOKEN: ${{ secrets.CHILD_REPOS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || true
          auth_header="$(printf '%s:%s' "$GITHUB_ACTOR" "$CHILD_REPOS_TOKEN" | base64 -w 0)"
          git subtree split --prefix=Dashboard -b sync-dashboard
          git -c "http.extraheader=AUTHORIZATION: basic ${auth_header}" push \
            "https://github.com/KamyarAhangar8778/Home-Control-Dashboard.git" sync-dashboard:main
